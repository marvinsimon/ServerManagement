services:
  recorder:
    image: owntracks/recorder:latest
    container_name: owntracks-recorder
    restart: unless-stopped
    environment:
      OTR_PORT: "0"   # Disable MQTT
    volumes:
      - ./owntrack/store:/store
    networks:
      - owntrack
      - entry

    labels:
      - traefik.enable=true
      - traefik.http.routers.owntracks-recorder.rule=Host(`api.owntracks.example.com`)
      - traefik.http.routers.owntracks-recorder.entrypoints=websecure
      - traefik.http.routers.owntracks-recorder.tls.certresolver=myresolver
      - traefik.http.services.owntracks-recorder.loadbalancer.server.port=8083
      - traefik.http.routers.owntracks-recorder.middlewares=security@docker # Use to apply security middlewares
      - traefik.docker.network=entry


  frontend:
    image: owntracks/frontend:latest
    container_name: owntracks-frontend
    restart: unless-stopped
    networks:
      - owntrack
      - entry
    volumes:
      - ./owntrack/config.js:/usr/share/nginx/html/config/config.js:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.owntracks.rule=Host(`owntracks.example.com`)
      - traefik.http.routers.owntracks.entrypoints=websecure
      - traefik.http.routers.owntracks.tls.certresolver=myresolver
      - traefik.http.services.owntracks.loadbalancer.server.port=80
      - traefik.http.routers.owntrack.middlewares=security@docker, anubis@docker # Use to apply security middlewares
      - traefik.docker.network=entry


networks:
  owntrack:
    name: owntrack
