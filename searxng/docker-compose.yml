# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

services:
  searxng:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    env_file: ./searxng/.env
    volumes:
      - ./searxng/core-config/:/etc/searxng/:Z
      - searxng-data:/var/cache/searxng/
    depends_on:
      - searxng-valkey
    labels:
      traefik.enable: true
      traefik.http.routers.searxng.rule: Host(`searxng.domain.here`)
      traefik.http.routers.searxng.entrypoints: websecure
      traefik.http.routers.searxng.tls: true
      traefik.http.routers.searxng.tls.certresolver: myresolver
      traefik.http.routers.searxng.middlewares: security@docker, anubis@docker
      traefik.http.services.searxng.loadbalancer.server.port: 8080
      traefik.docker.network: Entry
    networks:
      - entry
      - searxng

  searxng-valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - searxng-valkey-data:/data/
    networks:
      - searxng

volumes:
  searxng-data:
  searxng-valkey-data:

networks:
  searxng:
